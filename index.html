<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小说合集</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <style>
        body {
            padding: 2rem;
        }

        .novel-list {
            margin-top: 2rem;
        }

        .novel-title {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .novel-content {
            white-space: pre-wrap;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">我的小说合集</h1>
        <div id="novel-list" class="novel-list row"></div>
    </div>
    <script src="static/js/bootstrap.bundle.min.js"></script>
    <script>
        // 小说文件名列表
        const novels = [
            "novel (1).txt",
            "novel (2).txt",
            "novel (3).txt",
            "novel (4).txt",
            "novel (5).txt",
            "novel (6).txt",
            "novel (7).txt"
        ];
        const novelList = document.getElementById('novel-list');
        novels.forEach((filename, idx) => {
            fetch(`novels/${filename}`)
                .then(res => res.text())
                .then(text => {
                    const col = document.createElement('div');
                    col.className = 'col-12';
                    col.innerHTML = `
                    <div class="novel-title">小说 ${idx + 1}：${filename}</div>
                    <div class="novel-content">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                `;
                    novelList.appendChild(col);
                });
        });
    </script>
</body>

</html>
