<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>少女所不期望的英雄史诗</title>
    <!-- 移除bootstrap5，使用自定义样式 -->
    <style>
        :root {
            --main-bg: #FAF3E0;
            --main-text: #2E2E2E;
            --border-color: #E0D6C9;
            --content-bg: #FDF5E6;
            --toc-bg: #fffbe9;
            --toc-hover: #f3e9d7;
            --shadow: 0 4px 24px 0 rgba(224, 214, 201, 0.13);
            --radius: 12px;
            --font-main: 'STSong', 'Songti SC', 'Microsoft YaHei', serif;
        }

        html,
        body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 3vw 6vw 3vw 6vw;
            /* 四周留白更明显 */
            background: var(--main-bg, #FAF3E0);
            background-color: #FAF3E0;
            color: var(--main-text, #2E2E2E);
            font-family: var(--font-main);
            font-size: 1.08rem;
            line-height: 1.85;
            letter-spacing: 0.02em;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--content-bg, #FDF5E6);
            border-radius: var(--radius, 12px);
            box-shadow: var(--shadow);
            padding: 2.2rem 2.5rem 2.2rem 2.5rem;
        }

        @media (max-width: 800px) {
            .container {
                max-width: 98vw;
                padding: 0.7em 0.5em;
            }

            body {
                padding: 1vw 1vw 1vw 1vw;
            }
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--main-text, #2E2E2E);
            text-shadow: 0 2px 8px #f3e9d7;
        }

        #novel-toc {
            margin-bottom: 2.2rem;
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .list-group-item {
            display: block;
            background: var(--toc-bg, #fffbe9);
            background-color: #fffbe9;
            color: var(--main-text, #2E2E2E);
            border: 1px solid var(--border-color, #E0D6C9);
            border-radius: var(--radius, 12px);
            padding: 0.7em 1.2em;
            font-size: 1.08rem;
            font-weight: 500;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: background 0.2s, box-shadow 0.2s;
        }

        .list-group-item-action:active,
        .list-group-item-action:focus,
        .list-group-item-action:hover {
            background: var(--toc-hover, #f3e9d7);
            color: var(--main-text, #2E2E2E);
            box-shadow: 0 2px 12px 0 rgba(224, 214, 201, 0.18);
        }

        .novel-list {
            margin-top: 2rem;
        }

        .novel-title {
            font-weight: bold;
            font-size: 1.25rem;
            color: var(--main-text, #2E2E2E);
            margin-bottom: 0.7em;
            letter-spacing: 0.04em;
        }

        .novel-content {
            white-space: pre-wrap;
            background: var(--content-bg, #FDF5E6);
            background-color: #FDF5E6;
            padding: 1.3em 1.5em 1.3em 1.5em;
            border-radius: var(--radius, 12px);
            margin-bottom: 2.2rem;
            border: 1px solid var(--border-color, #E0D6C9);
            box-shadow: var(--shadow);
            font-size: 1.08rem;
            line-height: 2.05;
            font-family: var(--font-main);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color, #E0D6C9);
            margin: 2.5em 0;
        }

        @media (max-width: 800px) {
            .container {
                max-width: 98vw;
                padding: 0 2vw;
            }

            body {
                padding: 1vw 0 1vw 0;
            }

            .novel-content {
                padding: 1em 0.7em 1em 0.7em;
            }
        }
    </style>
    <div id="novel-toc" class="mb-4"></div>
    <div id="novel-content-area" class="novel-list row"></div>
    </div>
    <!-- 移除bootstrap5 JS引用 -->
    <script>
        // 小说文件名列表
        var novels = [
            "1 纯洁无瑕之物.txt",
            "2 诱惑之物.txt",
            "3 尊贵之物.txt",
            "4 所爱之物.txt",
            "5 阻挡之物.txt",
            "6 贯穿之人.txt",
            "7 对命理露出獠牙之人.txt"
        ];
        var novelContentArea = document.getElementById('novel-content-area');
        var novelToc = document.getElementById('novel-toc');
        // 生成目录
        var tocHtml = '<div class="list-group">';
        for (var i = 0; i < novels.length; i++) {
            tocHtml += '<a class="list-group-item list-group-item-action" href="#" data-idx="' + i + '">第' + (i + 1) + '章：' + novels[i] + '</a>';
        }
        tocHtml += '</div>';
        novelToc.innerHTML = tocHtml;

        // 兼容IE的事件绑定
        function getClosestLinkIE(element) {
            while (element && element !== document) {
                if (element.tagName && element.tagName.toLowerCase() === 'a' && element.getAttribute('data-idx') !== null) {
                    return element;
                }
                element = element.parentNode;
            }
            return null;
        }
        function addEventIE(el, event, handler) {
            if (el.addEventListener) {
                el.addEventListener(event, handler, false);
            } else if (el.attachEvent) {
                el.attachEvent('on' + event, handler);
            } else {
                el['on' + event] = handler;
            }
        }
        addEventIE(novelToc, 'click', function (e) {
            e = e || window.event;
            var target = e.target || e.srcElement;
            var link = getClosestLinkIE(target);
            if (!link) return;
            if (e.preventDefault) e.preventDefault();
            else e.returnValue = false;
            var idx = parseInt(link.getAttribute('data-idx'));
            var filename = novels[idx];
            // 兼容IE的AJAX加载
            var xhr = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject('Microsoft.XMLHTTP');
            xhr.open('GET', 'novels/' + encodeURIComponent(filename), true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var text = xhr.responseText;
                    // 简单转义
                    text = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    novelContentArea.innerHTML =
                        '<div class="col-12">' +
                        '<div class="novel-title">' + filename + '</div>' +
                        '<div class="novel-content">' + text + '</div>' +
                        '</div>';
                }
            };
            xhr.send();
        });
    </script>
    </body>

</html>
